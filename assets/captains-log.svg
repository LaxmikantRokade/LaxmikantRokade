<g font-family="Arial, Helvetica, sans-serif" fill="#e8eefb">
 <text x="285" y="64" fill="#ffc65b" font-size="18" font-family="monospace" letter-spacing="4">01 / CAPTAIN'S LOG</text>
 <text x="285" y="112" font-size="36" font-weight="700">Hey, I'm Laxmikant (Luffy) 👋</text>
 <text x="285" y="157" font-size="23">A third-year B.Tech IT student who turns ideas into useful digital products.</text>
 <text x="285" y="199" font-size="20" fill="#5ee6f0">FOCUS</text><text x="385" y="199" font-size="20">Modern web apps  •  Full-stack development  •  Generative AI</text>
 <text x="285" y="237" font-size="20" fill="#5ee6f0">MINDSET</text><text x="385" y="237" font-size="20">Build boldly. Learn constantly. Explore the unknown.</text>
 <text x="285" y="273" font-size="17" fill="#aab9d8">Inspired by the never-give-up spirit of the Grand Line.</text>
